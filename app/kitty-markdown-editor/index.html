<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A fully local Markdown editor with live preview that requires no internet access.">
    <title>Kitty Markdown Editor v1.1</title>

    <script>
      // The theme is applied before the page paints (no white flash on startup).
      try {
        document.documentElement.setAttribute(
          'data-theme',
          localStorage.getItem('kitty-markdown.theme') === 'dark' ? 'dark' : 'light'
        );
      } catch (error) {
        // If localStorage is disabled, the default theme is used
      }
    </script>
    <link rel="stylesheet" href="assets/style.css">
    <link id="css-light" rel="stylesheet" href="assets/github-markdown-light.css">
    <link id="css-dark" rel="stylesheet" href="assets/github-markdown-dark_dimmed.css" media="not all">
    <link rel="icon" href="assets/kitty.svg" type="image/svg+xml">
  </head>

  <body>
    <header>
      <div class="brand">
        <img src="assets/kitty.svg" alt="Kitty Markdown Editor logo">
        <span>Kitty Markdown Editor</span>
        <span class="version" id="brand-version">v1.1</span>
      </div>

      <div class="actions">
        <button id="btn-open" type="button" title="Open a Markdown file (Ctrl+O)">Open</button>
        <input id="file-input" type="file" accept=".md,.markdown,.txt,text/markdown" hidden>
        <button id="btn-save" type="button" title="Download as Markdown (Ctrl+S)">Save</button>
        <button id="btn-copy" type="button">Copy</button>
        <button id="btn-pdf" type="button" title="Save as PDF via the browser's print dialog">Export PDF</button>
        <button id="btn-reset" type="button">Reset</button>
        <button id="btn-find" type="button" aria-pressed="false" title="Find in the document (Ctrl+F)">Find</button>
        <button id="btn-fullscreen" type="button" aria-pressed="false" title="Full-screen preview (Ctrl+Shift+F)">Full screen</button>
        <label class="check">
          <input id="sync-scroll" type="checkbox">
          Sync scroll
        </label>
      </div>

      <div class="about">
        <button id="btn-theme" type="button">Dark theme</button>
        <button id="btn-about" type="button" aria-expanded="false" aria-controls="about-panel">About</button>
        <div id="about-panel" class="about-panel" role="dialog" aria-label="About Kitty Markdown Editor" hidden>
          <div class="about-name">Kitty Markdown Editor <span class="about-version" id="about-version">v1.1</span></div>
          <p>A fully local Markdown editor with live preview: no server, no setup, no internet access, no data collection, open source :)</p>
          <div class="about-links">
            <a href="https://github.com/faruk-guler" target="_blank" rel="noopener noreferrer">github.com/faruk-guler</a>
            <span aria-hidden="true">·</span>
            <a href="https://www.farukguler.com" target="_blank" rel="noopener noreferrer">www.farukguler.com</a>
          </div>
        </div>
      </div>
    </header>

    <main id="panes">
      <section id="editor-pane" class="pane">
        <textarea id="editor" spellcheck="false" aria-label="Markdown editor"></textarea>
        <div id="find-bar" class="find-bar" role="search" aria-label="Find in the document" hidden>
          <input id="find-input" type="search" placeholder="Find…" aria-label="Search text" autocomplete="off" spellcheck="false">
          <span id="find-count" class="find-count" role="status" aria-live="polite"></span>
          <button id="find-case" class="find-btn" type="button" title="Match case" aria-pressed="false">Aa</button>
          <button id="find-prev" class="find-btn" type="button" title="Previous match (Shift+Enter / Shift+F3)">&#9664;</button>
          <button id="find-next" class="find-btn" type="button" title="Next match (Enter / F3)">&#9660;</button>
          <button id="find-close" class="find-btn" type="button" title="Close (Esc)">&#10005;</button>
        </div>
      </section>

      <div id="divider" role="separator" aria-orientation="vertical" aria-label="Panel width"
           aria-valuemin="15" aria-valuenow="50" aria-valuemax="85" tabindex="0"></div>

      <section id="preview-pane" class="pane">
        <article id="output" class="markdown-body"></article>
      </section>
    </main>

    <footer>
      <span id="stat-words">Words: 0</span>
      <span id="stat-chars">Characters: 0</span>
      <span id="stat-lines">Lines: 0</span>
      <span id="stat-status" role="status" aria-live="polite">Ready</span>
    </footer>

    <script type="text/markdown" id="sample-doc">
# Kitty Markdown Editor Test Page

A fully local Markdown editor with live preview: no server, no setup, no internet access, no data collection, open source :)

### Open this file with a double click; whatever you type appears on the right instantly.

## Basic syntax
Test 1234...

## Shortcuts

- **Ctrl+O** open a file · **Ctrl+S** save · **Ctrl+P** print / PDF.
- **Ctrl+F** find in the document · **Enter** / **F3** next · **Shift+F3** previous · **Esc** close.
- **Ctrl+Shift+F** toggle full-screen preview.
- **Ctrl+=** bigger text · **Ctrl+-** smaller · **Ctrl+0** reset to 100%.
- **Tab** / **Shift+Tab** indent and outdent.
    </script>
    <script src="assets/marked.min.js"></script>
    <script src="assets/purify.min.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
