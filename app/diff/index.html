<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="./src/images/drill-logo.jpg">
  <link rel="stylesheet" href="./src/styles.css">
  <title>Diff Drill 2.3</title>
  <script>
    (function() {
      let savedTheme = localStorage.getItem('dc-theme');
      if (!savedTheme) {
        savedTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>

<body>

  <header class="topbar">
    <div class="topbar-logo">
      <img src="./src/images/drill-logo.jpg" alt="Diff Drill Logo" class="logo-icon-img">
      <span class="logo-text">Diff Drill v2.3</span>
    </div>
    <nav class="topbar-nav">
      <button id="compareBtn" title="Find difference (Ctrl + Enter)">Find difference!</button>
    </nav>
    <div class="topbar-right">
      <label class="option-label">
        <input type="checkbox" id="hideUnchanged"> Hide Unchanged Lines
      </label>
      <label class="option-label">
        <input type="checkbox" id="ignoreWhitespace"> Ignore Whitespace
      </label>
      <button class="icon-btn" id="themeToggle" title="Toggle light/dark mode" aria-label="Toggle Theme"></button>
      <button class="icon-btn" id="aboutBtn" title="About" aria-label="About">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      </button>
    </div>
  </header>

  <main class="editor-area">
    <div class="editor-panel">
      <div class="panel-header">Original text</div>
      <textarea id="oldText" spellcheck="false" placeholder="Paste original text here..."></textarea>
    </div>
    <button class="swap-btn" id="swapBtn" title="Swap panels" aria-label="Swap">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="m16 3 4 4-4 4"></path>
        <path d="M20 7H4"></path>
        <path d="m8 21-4-4 4-4"></path>
        <path d="M4 17h16"></path>
      </svg>
    </button>
    <div class="editor-panel">
      <div class="panel-header">Changed text</div>
      <textarea id="newText" spellcheck="false" placeholder="Paste changed text here..."></textarea>
    </div>
  </main>

  <div class="stats-bar hidden" id="statsBar">
    <div class="stats-left" id="statsRemoved"></div>
    <div class="stats-center" id="statsLines"></div>
    <div class="stats-right" id="statsAdded"></div>
  </div>

  <div class="output-wrapper hidden" id="outputWrapper">
    <div class="toolbar">
      <div class="mode-group">
        <button class="mode-btn active" data-mode="split">⧉ Split</button>
        <button class="mode-btn" data-mode="unified">≡ Unified</button>
      </div>
      <div class="toolbar-spacer"></div>

      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" class="search-icon">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchDiff" placeholder="Search in diff..." class="search-input">
      </div>

      <button class="toolbar-btn" id="copyBtn" title="Copy original text">⎘ Copy</button>
      <button class="toolbar-btn" id="exportBtn" title="Export as .diff file">↑ Export</button>
      <button class="toolbar-btn danger" id="clearBtn">✕ Clear</button>
    </div>
    <div class="diff-output" id="diffOutput"></div>
  </div>

  <!-- About Modal -->
  <div class="modal-overlay" id="aboutModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-header">
        <div class="header-spacer"></div>
        <div class="modal-title-group">
          <img src="./src/images/drill-logo.jpg" alt="Diff Drill Logo" class="modal-logo-img">
          <h2 id="modalTitle">About Diff Drill</h2>
        </div>
        <button class="modal-close" id="modalClose" aria-label="Close Modal">✕</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">A lightweight, fast, and simple code & text difference checker.</p>
        <div class="modal-author">
          <div class="author-links">
            <a href="https://github.com/faruk-guler" target="_blank" rel="noopener">github.com/faruk-guler</a>
            <span>·</span>
            <a href="https://www.farukguler.com" target="_blank" rel="noopener">www.farukguler.com</a>
          </div>
        </div>
        <div class="modal-meta">
          <span>Version 2.3</span>
          <span>·</span>
          <span>Pure HTML / CSS / JS</span>
        </div>
      </div>
    </div>
  </div>

  <script src="./src/diff.min.js"></script>
  <script src="./src/index.js"></script>
</body>

</html>
